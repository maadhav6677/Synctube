services:
  - type: web
    name: synctube-maadhav
    runtime: node
    plan: free
    buildCommand: cd server && npm ci && npm run build && cd ../client && npm ci && npm run build
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
