version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    # Keep lockfile updates together so related backend dependencies do not
    # leave separate PRs conflicted after one is merged.
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /client
    # React, its types, Vite, and the React plugin have peer dependencies and
    # must be evaluated as one compatible update.
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
    schedule:
      interval: weekly
